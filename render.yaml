services:
  - type: web
    name: school-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --workspaces=false
    startCommand: npm run migrate:up && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PARENT_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SCHOOL_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: AI_DEFAULT_MODEL_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_FLOW_ID
        sync: false
      - key: MSG91_COUNTRY
        sync: false
      - key: MSG91_WHATSAPP_ENABLED
        sync: false
      - key: MSG91_WHATSAPP_SENDER_PHONE
        sync: false

  - type: static
    name: school-dashboard
    rootDir: school-dashboard
    buildCommand: npm install --workspaces=false && npm run build
    staticPublishPath: school-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend URL including the /api suffix.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SCHOOL_NAME
        sync: false
      - key: VITE_SCHOOL_ADDRESS
        sync: false
      - key: VITE_SCHOOL_CONTACT
        sync: false
      - key: VITE_SCHOOL_GSTIN
        sync: false

  - type: static
    name: parent-app-web
    rootDir: parent-app
    buildCommand: npm install --workspaces=false && npm run build:web
    staticPublishPath: parent-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Use the backend origin without /api here.
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
      - key: EXPO_PUBLIC_SOCKET_URL
        sync: false

  - type: cron
    name: school-db-backup
    runtime: node
    rootDir: backend
    schedule: "0 2 * * *"
    buildCommand: npm install --workspaces=false
    startCommand: npm run backup:db
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_FORCE_PATH_STYLE
        sync: false

  # Runs every Sunday at 04:00 UTC — downloads the latest backup from S3,
  # decompresses every collection file, and validates document counts against
  # the manifest. Exits non-zero if anything is unreadable so Render marks
  # the cron run as failed and alerts on-call.
  - type: cron
    name: school-db-backup-verify
    runtime: node
    rootDir: backend
    schedule: "0 4 * * 0"
    buildCommand: npm install --workspaces=false
    startCommand: npm run backup:verify
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_FORCE_PATH_STYLE
        sync: false
