services:
  - type: web
    name: school-backend
    runtime: node
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate:up && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PARENT_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SCHOOL_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: AI_DEFAULT_MODEL_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_FLOW_ID
        sync: false
      - key: MSG91_COUNTRY
        sync: false
      - key: MSG91_WHATSAPP_ENABLED
        sync: false
      - key: MSG91_WHATSAPP_SENDER_PHONE
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS_REJECT_UNAUTHORIZED
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: warn
      - key: LOKI_URL
        sync: false
      - key: LOKI_USERNAME
        sync: false
      - key: LOKI_PASSWORD
        sync: false
      - key: DD_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_INDEX
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: AGENDA_DB_COLLECTION
        value: jobs
      - key: AGENDA_PROCESS_EVERY
        value: 5_seconds
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: PEERJS_PORT
        value: 9000
      - key: PEERJS_PATH
        value: /peerjs
      - key: STUN_SERVERS
        sync: false
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SERVER_USERNAME
        sync: false
      - key: TURN_SERVER_PASSWORD
        sync: false

  - type: cron
    name: school-db-backup
    runtime: node
    rootDir: .
    schedule: "0 2 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run backup:db
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_FORCE_PATH_STYLE
        sync: false

  # Runs every Sunday at 04:00 UTC — downloads the latest backup from S3,
  # decompresses every collection file, and validates document counts against
  # the manifest. Exits non-zero if anything is unreadable so Render marks
  # the cron run as failed and alerts on-call.
  - type: cron
    name: school-db-backup-verify
    runtime: node
    rootDir: .
    schedule: "0 4 * * 0"
    buildCommand: npm ci --omit=dev
    startCommand: npm run backup:verify
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PREFIX
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_FORCE_PATH_STYLE
        sync: false
