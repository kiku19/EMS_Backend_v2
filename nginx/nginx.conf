# nginx reverse proxy / load balancer for multi-instance EMS backend
# Usage: docker compose up --scale app=2
#
# Session affinity: NOT required because auth uses stateless JWT tokens.
# All socket.io broadcasts are shared via the Redis adapter, so any instance
# can handle any WebSocket connection.
#
# If you ever add server-side session state, enable ip_hash below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream ems_backend {
        # Round-robin (default) — works because JWT is stateless.
        # Uncomment ip_hash below ONLY if sticky sessions become necessary.
        # ip_hash;

        server app:3001;
        # Docker Compose resolves "app" to all scaled containers via its
        # internal DNS round-robin. For 2+ replicas this distributes traffic
        # evenly without additional configuration.
    }

    server {
        listen 80;

        # Health / readiness probes — direct to backend, no body buffering
        location ~ ^/(health|healthz|readyz) {
            proxy_pass http://ems_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # WebSocket upgrade — required for Socket.IO
        location /socket.io/ {
            proxy_pass http://ems_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;  # keep WS connections alive
        }

        # All other API traffic
        location / {
            proxy_pass http://ems_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
