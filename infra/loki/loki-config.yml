# OBS-03: Grafana Loki Configuration
#
# Retention policy:
#   Hot storage  — 30 days  (local disk, fast query)
#   Cold storage — 90 days  (compactor deletes after retention_period)
#
# To extend cold storage to an S3-compatible bucket (Cloudflare R2, AWS S3,
# MinIO), replace the filesystem storage config with an object_store block —
# see https://grafana.com/docs/loki/latest/configure/#storage_config

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ── Retention ──────────────────────────────────────────────────────────────
# compactor runs the retention/deletion of old chunks.
# retention_period = total lifespan of log data.
# Adjust per-stream retention by adding per_stream_retention_rules below.
limits_config:
  # 90 days total retention (hot 30d effectively achieved via query time range)
  retention_period: 2160h   # 90 days

  # Ingestion rate limits (adjust to match your log volume)
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_lookback: 2160h

  # Per-stream rate limit
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
